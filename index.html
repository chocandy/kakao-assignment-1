<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">

      <!-- 앱 헤더 -->
      <header class="app-header">
        <h1 class="app-title">Todo</h1>
      </header>

      <!-- 날짜 네비게이션: 이전/다음 버튼으로 날짜 이동 -->
      <div class="date-nav">
        <button class="date-nav-btn" id="prevDayBtn" aria-label="이전 날짜">&#8249;</button>
        <div class="date-display">
          <span class="date-text" id="currentDateDisplay"></span>
          <span class="today-badge" id="todayBadge">오늘</span>
        </div>
        <button class="date-nav-btn" id="nextDayBtn" aria-label="다음 날짜">&#8250;</button>
      </div>

      <!-- 할 일 입력 영역 -->
      <div class="input-area">
        <input
          type="text"
          id="todoInput"
          class="todo-input"
          placeholder="새 할 일을 입력하세요..."
          maxlength="100"
          autocomplete="off"
        />
        <button class="add-btn" id="addBtn">추가</button>
      </div>

      <!-- 빈 값 입력 시 안내 메시지 -->
      <p class="error-msg" id="errorMsg">할 일을 입력해주세요.</p>

      <!-- 상태별 필터 탭: 전체 / 진행중 / 완료 -->
      <div class="filter-tabs" role="tablist">
        <button class="filter-tab active" data-filter="all" role="tab">전체</button>
        <button class="filter-tab" data-filter="active" role="tab">진행중</button>
        <button class="filter-tab" data-filter="completed" role="tab">완료</button>
      </div>

      <!-- Todo 목록 -->
      <ul class="todo-list" id="todoList" aria-label="할 일 목록"></ul>

      <!-- 할 일이 없을 때 표시되는 빈 상태 메시지 -->
      <div class="empty-state" id="emptyState">
        <p class="empty-msg">이 날의 할 일이 없습니다.</p>
      </div>

    </div>

    <script src="app.js"></script>
  </body>
</html>
